<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Penyusutan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      padding: 16px;
    }

    .gif-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .gif-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      display: block;
    }
  </style>
</head>
<body>
  <main class="gif-container">
    <img 
      src="https://media.tenor.com/C7YIu67b1t0AAAAC/kicau-mania-scuba-kicau.gif" 
      alt="Kicau Mania Scuba Kicau"
    >
  </main>
</body>
</html>
