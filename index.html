<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Penyusutan</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f172a;
      padding: 16px;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      display: block;
    }

    .tap-hint {
      color: #94a3b8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      text-align: center;
      padding: 8px 16px;
      background: rgba(30, 41, 59, 0.7);
      border-radius: 9999px;
      backdrop-filter: blur(4px);
      transition: opacity 0.3s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    #sc-player {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <main class="container">
    <img 
      src="ttps://github.com/ekabudiku/kalkulator-std-dev/blob/main/kicau-mania.gif" 
      alt="Kicau Mania Scuba Kicau"
    >
    <div id="hint" class="tap-hint">MUSIKKKKKK🎵</div>
  </main>

  <iframe 
    id="sc-player" 
    src="https://w.soundcloud.com/player/?url=https%3A//soundcloud.com/stevechris/kicau-mania-steve-chris-edit&auto_play=false" 
    allow="autoplay">
  </iframe>

  <script src="https://w.soundcloud.com/player/api.js"></script>
  <script>
    const iframe = document.getElementById('sc-player');
    const hint = document.getElementById('hint');
    const widget = SC.Widget(iframe);
    let isPlayed = false;

    function startAudio() {
      if (!isPlayed) {
        widget.play();
        isPlayed = true;
        hint.classList.add('hidden');
      }
    }

    document.body.addEventListener('click', startAudio, { once: true });
    document.body.addEventListener('touchstart', startAudio, { once: true });
  </script>
</body>
</html>
